<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/sass/style.css" />
    <title>Piano</title>
  </head>
  <body>
    <main class="main">
      <div class="wrapper">
        <section class="piano">
          <div class="piano__settings"></div>
          <div class="piano__keys">
            <div class="piano__octave">
              <div class="piano__key-white" data-key="c3">
                <span class="piano__key-name">Q</span>
              </div>
              <div class="piano__key-white" data-key="d3">
                <span class="piano__key-name">W</span>
              </div>
              <div class="piano__key-white" data-key="e3">
                <span class="piano__key-name">E</span>
              </div>
              <div class="piano__key-white" data-key="f3">
                <span class="piano__key-name">R</span>
              </div>
              <div class="piano__key-white" data-key="g3">
                <span class="piano__key-name">T</span>
              </div>
              <div class="piano__key-white" data-key="a3">
                <span class="piano__key-name">Y</span>
              </div>
              <div class="piano__key-white" data-key="b3">
                <span class="piano__key-name">U</span>
              </div>
              <div class="piano__key-black" data-key="c#3">1</div>
              <div class="piano__key-black" data-key="d#3">2</div>
              <div class="piano__key-black" data-key="f">3</div>
              <div class="piano__key-black" data-key="g">4</div>
              <div class="piano__key-black" data-key="a">5</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
